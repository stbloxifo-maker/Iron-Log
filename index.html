<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Iron Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#08090C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Iron Log v3 — focus-mode logger. One dark look on purpose: near-black steel, plate blue
   for "now", green for "done", gold for records. Condensed heavy type, tabular numbers. */
:root {
  --bg: #08090C;
  --bg-2: #0E1015;
  --card: #14171E;
  --card-2: #1C2029;
  --line: #262B35;
  --ink: #F1F3F7;
  --muted: #8A93A1;
  --dim: #545C69;
  --blue: #3D7BFF;
  --blue-2: #8DB1FF;
  --blue-glow: rgba(61, 123, 255, 0.4);
  --green: #27D07A;
  --green-ink: #04220F;
  --green-soft: rgba(39, 208, 122, 0.14);
  --gold: #FFC53D;
  --gold-soft: rgba(255, 197, 61, 0.14);
  --red: #FF5A52;
  --f: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .9, .25, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --gl: max(20px, env(safe-area-inset-left, 0px));
  --gr: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); color: var(--ink); height: 100%; }
body { font-family: var(--f); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; }
.cond { font-stretch: 70%; font-weight: 850; text-transform: uppercase; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.blue { color: var(--blue-2); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
svg { flex: none; }

/* ================= Home ================= */
#home { max-width: 540px; margin: 0 auto; padding: calc(var(--sat) + 14px) var(--gr) calc(var(--sab) + 40px) var(--gl); display: flex; flex-direction: column; gap: 22px; }
.enter > * { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.top .d { font-size: 14px; color: var(--muted); font-weight: 600; }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--muted); transition: transform .15s var(--ease); }
.round:active { transform: scale(.9); }
.round svg { width: 21px; height: 21px; }

.today { position: relative; display: flex; flex-direction: column; gap: 14px; }
.mega { font-size: clamp(76px, 25vw, 112px); line-height: .82; margin-left: -3px; background: linear-gradient(180deg, #fff 40%, #9fb8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.today .meta { font-size: 15px; color: var(--muted); font-weight: 600; }
.plan { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.plan .r { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.plan .r .n { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .r .s { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag.up { background: var(--gold-soft); color: var(--gold); }
.tag.down { background: rgba(255,90,82,.14); color: var(--red); }
.tag.beat { background: rgba(61,123,255,.16); color: var(--blue-2); }
.tag.new { background: var(--green-soft); color: var(--green); }

.go { position: relative; overflow: hidden; width: 100%; height: 72px; border-radius: 24px; background: var(--blue); color: #fff; font-size: 26px;
  display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 14px 34px var(--blue-glow); transition: transform .18s var(--ease), box-shadow .18s; }
.go:active { transform: scale(.97); box-shadow: 0 6px 16px var(--blue-glow); }
.go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.25) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 3.6s ease-in-out 1.2s infinite; }
@keyframes sheen { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.go svg { width: 24px; height: 24px; }
.today > .go { position: sticky; bottom: calc(var(--sab) + 12px); z-index: 5; }
.link { align-self: center; color: var(--blue-2); font-weight: 650; font-size: 15px; padding: 6px 12px; }

.card { background: var(--card); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; width: 100%; text-align: left; transition: transform .15s var(--ease); }
button.card:active { transform: scale(.985); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11px; font-weight: 750; color: var(--dim); }
.week b { width: 100%; max-width: 38px; aspect-ratio: 1; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.week .on b { background: var(--blue); color: #fff; box-shadow: 0 5px 14px var(--blue-glow); animation: pop .5s var(--spring) both; }
.week .now { color: var(--ink); }
.week .now b { box-shadow: inset 0 0 0 2px var(--blue-2); }
.week .on.now b { box-shadow: 0 5px 14px var(--blue-glow), inset 0 0 0 2px #fff; }
.streak { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 650; color: var(--muted); }
.flame { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); }
.flame svg { width: 17px; height: 17px; animation: flicker 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flicker { 40% { transform: scale(1.1) rotate(-5deg); } 70% { transform: scale(.95) rotate(3deg); } }
.sech { display: flex; align-items: baseline; justify-content: space-between; }
.sech h2 { font-size: 26px; line-height: 1; }
.lifts { display: flex; flex-direction: column; gap: 8px; }
.lift { display: grid; grid-template-columns: minmax(0,1fr) 76px 64px; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card); border-radius: 18px; width: 100%; text-align: left; transition: transform .15s var(--ease); }
.lift:active { transform: scale(.98); }
.lift .nm { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lift small { display: block; font-size: 12.5px; color: var(--muted); }
.lift .v { text-align: right; }
.lift .v b { font-size: 22px; font-stretch: 80%; font-weight: 800; font-variant-numeric: tabular-nums; }
.lift .v em { display: block; font-style: normal; font-size: 12px; font-weight: 800; color: var(--green); }
.spark { width: 76px; height: 30px; overflow: visible; }
.spark path { fill: none; stroke: var(--blue-2); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawl 1s var(--ease) .3s forwards; }
.spark circle { fill: var(--blue-2); }
@keyframes drawl { to { stroke-dashoffset: 0; } }
.empty { text-align: center; padding: 26px 18px; color: var(--muted); font-size: 14.5px; background: var(--card); border-radius: 20px; }

/* ================= Focus mode ================= */
#wo:empty, #sum:empty, #rest:empty, #sheet:empty { display: none; }
.full { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.full.in { animation: up .45s var(--ease) both; }
@keyframes up { from { transform: translateY(100%); } }
.fhead { display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 8px) var(--gr) 8px var(--gl); }
.fhead .t { flex: 1; text-align: center; font-weight: 750; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fin { height: 40px; padding: 0 16px; border-radius: 14px; background: var(--card-2); font-weight: 800; font-size: 15px; transition: background .25s, color .25s; }
.fin.ready { background: var(--green); color: var(--green-ink); }
.segs { display: flex; gap: 4px; padding: 4px var(--gr) 0 var(--gl); }
.segs button { flex: 1; height: 6px; border-radius: 3px; background: var(--card-2); position: relative; overflow: hidden; }
.segs button::after { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p, 0)); background: var(--green); transition: transform .5s var(--spring); }
.segs button.cur { background: rgba(61,123,255,.35); }
.segs button.cur::after { background: var(--blue); }

.stage { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.focus { max-width: 540px; margin: 0 auto; padding: 14px var(--gr) 18px var(--gl); display: flex; flex-direction: column; gap: 14px; }
.focus.next { animation: inR .38s var(--ease) both; }
.focus.prev { animation: inL .38s var(--ease) both; }
@keyframes inR { from { opacity: 0; transform: translateX(60px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-60px); } }
.exhead { display: flex; align-items: flex-start; gap: 8px; }
.exhead .ttl { flex: 1; min-width: 0; text-align: left; }
.exname { font-size: clamp(34px, 10vw, 46px); line-height: .9; margin-top: 6px; overflow-wrap: anywhere; }
.arrow { width: 44px; height: 44px; border-radius: 14px; background: var(--card); display: grid; place-items: center; color: var(--muted); margin-top: 2px; }
.arrow:disabled { opacity: .25; }
.arrow svg { width: 20px; height: 20px; }
.coach { display: flex; flex-direction: column; gap: 6px; }
.coach p { font-size: 15px; color: var(--muted); line-height: 1.45; }
.coach p b { color: var(--ink); }
.coach .last { font-size: 13.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-width: 50px; height: 48px; padding: 0 10px; border-radius: 16px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1; font-variant-numeric: tabular-nums; transition: background .25s, transform .2s var(--spring), box-shadow .25s; }
.pill small { font-size: 10.5px; font-weight: 800; color: var(--dim); letter-spacing: .06em; }
.pill b { font-size: 17px; font-weight: 800; margin-top: 3px; color: var(--muted); }
.pill.done { background: var(--green-soft); }
.pill.done b { color: var(--green); }
.pill.cur { background: var(--blue); box-shadow: 0 6px 16px var(--blue-glow); transform: translateY(-2px); }
.pill.cur small { color: rgba(255,255,255,.75); }
.pill.cur b { color: #fff; }
.pill.just { animation: pop .5s var(--spring); }
@keyframes pop { 0% { transform: scale(.75); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

.setbox { background: var(--card); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.setbox .lab { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.adj { display: grid; grid-template-columns: 64px minmax(0,1fr) 64px; gap: 10px; align-items: center; }
.adj > button { height: 64px; border-radius: 22px; background: var(--card-2); font-size: 34px; font-weight: 500; transition: transform .1s, background .15s; }
.adj > button:active { transform: scale(.9); background: var(--line); }
.val { position: relative; height: 64px; border-radius: 22px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.val input { width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font-size: clamp(36px, 11vw, 48px); font-weight: 850; font-stretch: 72%; font-variant-numeric: tabular-nums; padding: 0 8px; letter-spacing: -0.01em; caret-color: var(--blue); }
.val input::placeholder { color: var(--dim); }
.val span { position: absolute; right: 10px; top: 8px; font-size: 11px; letter-spacing: .06em; font-weight: 800; color: var(--muted); pointer-events: none; }
.val.need { animation: shake .4s ease; box-shadow: inset 0 0 0 2px var(--red); }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.setbox.locked { box-shadow: inset 0 0 0 2px var(--green); }

.dock { padding: 12px var(--gr) calc(var(--sab) + 14px) var(--gl); background: linear-gradient(180deg, rgba(8,9,12,0), var(--bg) 30%); }
.dock .in { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.donebtn { width: 100%; height: 78px; border-radius: 26px; background: var(--green); color: var(--green-ink); font-size: 28px; display: flex; align-items: center; justify-content: center; gap: 12px;
  box-shadow: 0 14px 34px rgba(39,208,122,.32); transition: transform .14s var(--ease); }
.donebtn:active { transform: scale(.96); }
.donebtn svg { width: 30px; height: 30px; }
.donebtn.ghost { background: var(--card); color: var(--ink); box-shadow: none; font-size: 20px; }
.dockrow { display: flex; gap: 8px; }
.dockrow button { flex: 1; height: 46px; border-radius: 15px; background: var(--card); color: var(--muted); font-weight: 750; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.dockrow svg { width: 18px; height: 18px; }

/* Rest */
.restov { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,12,.93); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: calc(var(--sat) + 20px) var(--gr) calc(var(--sab) + 24px) var(--gl); animation: fade .3s ease both; }
.restov.out { animation: fadeout .25s ease both; }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.ring { position: relative; width: min(74vw, 300px); aspect-ratio: 1; animation: pop .55s var(--spring) both; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--card-2); }
.ring .arc { stroke: var(--blue); transition: stroke-dashoffset .3s linear, stroke .3s; filter: drop-shadow(0 0 10px var(--blue-glow)); }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .c b { font-size: clamp(64px, 22vw, 92px); font-weight: 850; font-stretch: 72%; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .c small { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--muted); margin-top: 6px; }
.restov.over .arc { stroke: var(--green); filter: drop-shadow(0 0 14px rgba(39,208,122,.6)); }
.restov.over .c b { color: var(--green); }
.restov.over .ring { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.upnext { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.upnext b { font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
.rbtns { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; width: 100%; max-width: 420px; }
.rbtns button { height: 60px; border-radius: 20px; background: var(--card); font-weight: 800; font-size: 17px; }
.rbtns .skip { background: var(--blue); color: #fff; }
.restov.over .rbtns .skip { background: var(--green); color: var(--green-ink); }

.fhead .t { height: 40px; border-radius: 12px; }
.fhead .t.rest { color: var(--blue-2); font-weight: 800; }
.fhead .t.go { color: var(--green); font-weight: 850; animation: pulse 1s ease-in-out infinite; }
.warm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.warm:empty { display: none; }
.warm .eyebrow { margin-right: 2px; }
.wchip { font-size: 13px; padding: 5px 8px; border-radius: 10px; background: var(--card); color: var(--muted); font-variant-numeric: tabular-nums; }
.wchip b { color: var(--ink); font-weight: 750; }
.prburst { display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 22px; background: var(--gold-soft); border: 1px solid rgba(255,197,61,.45); animation: pop .6s var(--spring) both; box-shadow: 0 0 40px rgba(255,197,61,.18); }
.prburst .m { width: 44px; height: 44px; border-radius: 14px; background: var(--gold); color: #3A2A00; display: grid; place-items: center; font-weight: 900; font-size: 14px; flex: none; }
.prburst b { display: block; color: var(--gold); font-size: 16px; }
.prburst small { color: var(--muted); font-size: 13.5px; }
.rhint { font-size: 13px; color: var(--dim); }
.today.done .mega { background: linear-gradient(180deg, #fff 30%, #7ff0b4); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: left; }
.nextcard { flex-direction: row; align-items: center; gap: 12px; }
.nextcard b { font-size: 30px; line-height: 1; display: block; margin-top: 4px; }
#homeRest { color: var(--blue-2); font-weight: 750; }

/* body map + barbell + motion */
.bm { display: block; overflow: visible; height: auto; }
.bm .n { fill: var(--card-2); }
.bm .base { fill: #171B23; }
.bm .sec { fill: rgba(61,123,255,.42); }
.bm .on { fill: var(--blue); filter: drop-shadow(0 0 3px rgba(61,123,255,.85)); animation: musc 2.6s ease-in-out infinite; }
@keyframes musc { 50% { opacity: .72; } }
.bm.seq .on { animation: lightup .55s var(--ease) both, musc 2.6s ease-in-out infinite; animation-delay: calc(var(--k) * 70ms + .15s), calc(var(--k) * 70ms + .8s); }
.bm.seq .sec { animation: lightup .55s var(--ease) both; animation-delay: calc(var(--k) * 70ms + .15s); }
@keyframes lightup { from { fill: var(--card-2); filter: none; } }
.today.done .bm .on, .sum .bm .on { fill: var(--green); filter: drop-shadow(0 0 3px rgba(39,208,122,.85)); }
.today.done .bm .sec, .sum .bm .sec { fill: rgba(39,208,122,.38); }
.daymap { display: flex; align-items: center; gap: 16px; }
.daymap .bm { width: 132px; flex: none; }
.daymap .info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.daymap .meta { white-space: nowrap; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 9px; background: rgba(61,123,255,.16); color: var(--blue-2); }
.today.done .mchip { background: var(--green-soft); color: var(--green); }
.coachrow { display: flex; gap: 12px; align-items: center; }
.coachrow .coach { flex: 1; min-width: 0; }
.coachrow .bm { width: 78px; flex: none; }
.barbell { width: 100%; height: auto; display: block; }
.barbell .new { animation: plateIn .45s var(--spring) both; animation-delay: calc(var(--k) * 55ms); transform-box: fill-box; }
.barbell .new.r { animation-name: plateInR; }
@keyframes plateIn { from { transform: translateX(-26px); opacity: 0; } }
@keyframes plateInR { from { transform: translateX(26px); opacity: 0; } }
.val.bump input { animation: bump .22s var(--spring); }
@keyframes bump { 50% { transform: scale(1.09); } }
.burst { position: fixed; z-index: 55; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--green); pointer-events: none; animation: burst .65s ease-out forwards; }
@keyframes burst { to { transform: scale(10); opacity: 0; border-width: 1px; } }
.today { isolation: isolate; }
.today::before { content: ""; position: absolute; z-index: -1; left: -60px; top: -40px; width: 320px; height: 320px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(61,123,255,.22), transparent 65%); animation: drift 11s ease-in-out infinite; }
.today.done::before { background: radial-gradient(circle, rgba(39,208,122,.18), transparent 65%); }
@keyframes drift { 50% { transform: translate(70px, 50px) scale(1.2); } }
#home { overflow-x: clip; }
.upnext .bm { width: 116px; margin: 2px auto 8px; }
.restov.hasmap .ring { width: min(58vw, 236px); }
.sumhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sumhead .bm { width: 128px; flex: none; }
.sum h1 { font-size: clamp(44px, 14vw, 64px) !important; }
.lifthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.lifthead .bm { width: 84px; flex: none; }

/* level + plan editor + intro */
.lvl { display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; }
.lvl .ring2 { position: relative; width: 46px; height: 46px; flex: none; }
.lvl svg { width: 46px; height: 46px; transform: rotate(-90deg); }
.lvl .tr { stroke: var(--card-2); }

function tone(freq, t0, dur, type, vol, f2) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);

  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain(); f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = 3; g.gain.value = .35; n.buffer = buf; n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(t0); }
function sfx(kind) {
  if (typeof audioCtx === "undefined" || !audioCtx || D.settings.sound === false) return;
  try { const t = audioCtx.currentTime;
    if (kind === "done") { tone(190, t, .16, "sine", .55, 52); clank(t, .07); }
    else if (kind === "pr") [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .09, .26, "triangle", .3));
    else if (kind === "level") { [523, 659, 784].forEach(f => tone(f, t, 1, "triangle", .16)); [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + .28 + i * .08, .32, "sine", .14)); }
