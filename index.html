<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Iron Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Iron Log — one dark "gym floor" look on purpose: graphite, competition-plate blue,
   PR gold. Condensed heavy type for names, tabular numerals everywhere numbers matter. */
:root {
  --bg: #0A0D12;
  --bg-2: #0F131A;
  --card: #151A22;
  --card-2: #1C222C;
  --line: #262D38;
  --ink: #EEF1F5;
  --muted: #8C96A4;
  --dim: #5A6472;
  --accent: #3D7BFF;
  --accent-2: #86ACFF;
  --accent-glow: rgba(61, 123, 255, 0.38);
  --good: #2FD27A;
  --good-soft: rgba(47, 210, 122, 0.13);
  --gold: #FFC53D;
  --gold-soft: rgba(255, 197, 61, 0.14);
  --danger: #FF5A52;
  --f: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .9, .25, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); color: var(--ink); height: 100%; }
body {
  font-family: var(--f); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
  -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; touch-action: manipulation; padding: 0; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.cond { font-stretch: 72%; font-weight: 850; text-transform: uppercase; letter-spacing: 0.005em; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.eyebrow { font-size: 11.5px; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow.blue { color: var(--accent-2); }

/* ---------- Shell ---------- */
#view {
  max-width: 560px; margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.enter > * { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.topbar .grow { flex: 1; min-width: 0; }
.hello { font-size: 15px; color: var(--muted); }
.title { font-size: 34px; line-height: 1; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--card); color: var(--muted); transition: transform .15s var(--ease); }
.iconbtn:active { transform: scale(.92); }
.iconbtn svg { width: 22px; height: 22px; }

nav#nav {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; gap: 4px; padding: 6px; border-radius: 22px;
  background: rgba(21, 26, 34, 0.82); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.45);
}
nav#nav button { position: relative; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 17px; color: var(--muted); font-weight: 700; font-size: 14px; transition: color .25s, background .25s; }
nav#nav button svg { width: 22px; height: 22px; flex: none; }
nav#nav button span { display: none; }
nav#nav button.on { color: #fff; background: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); }
nav#nav button.on span { display: inline; }

.card { background: var(--card); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* ---------- Train ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--dim); }
.wd b { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 14px; color: var(--muted); background: var(--card-2); transition: transform .3s var(--spring); }
.wd.done b { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
.wd.today { color: var(--ink); }
.wd.today b { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.weekline { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.flame { display: inline-flex; align-items: center; gap: 5px; color: var(--gold); font-weight: 750; }
.flame svg { width: 16px; height: 16px; animation: flicker 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.08) rotate(-4deg); } 70% { transform: scale(.96) rotate(3deg); } }

.hero { position: relative; overflow: hidden; background: linear-gradient(160deg, #18213A 0%, var(--card) 55%); border: 1px solid rgba(134,172,255,0.12); }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(61,123,255,0.28), transparent 70%); pointer-events: none; animation: drift 9s ease-in-out infinite; }
@keyframes drift { 50% { transform: translate(-30px, 24px) scale(1.15); } }
.dayname { font-size: clamp(54px, 17vw, 78px); line-height: .86; margin-top: 2px; }
.daymeta { font-size: 14px; color: var(--muted); }
.xlist { display: flex; flex-direction: column; }
.xrow { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.xrow .n { font-weight: 600; font-size: 15.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xrow .t { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 750; padding: 3px 8px; border-radius: 8px; background: var(--card-2); color: var(--muted); }
.tag.up { background: var(--gold-soft); color: var(--gold); }
.tag.beat { background: rgba(61,123,255,0.15); color: var(--accent-2); }
.tag.new { background: var(--good-soft); color: var(--good); }
.tag.down { background: rgba(255,90,82,0.13); color: var(--danger); }

.go { position: relative; overflow: hidden; height: 62px; border-radius: 20px; width: 100%; background: var(--accent); color: #fff;
  font-size: 22px; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 10px 28px var(--accent-glow); transition: transform .18s var(--ease), box-shadow .18s; }
.go:active { transform: scale(.97); box-shadow: 0 4px 14px var(--accent-glow); }
.go::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%); transform: translateX(-100%); animation: sheen 3.2s ease-in-out infinite 1s; }
@keyframes sheen { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.go svg { width: 22px; height: 22px; }
.go.good { background: var(--good); color: #062614; box-shadow: 0 10px 28px rgba(47,210,122,0.35); }
.linkbtn { color: var(--accent-2); font-weight: 650; font-size: 15px; padding: 10px 4px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.mini { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card); border-radius: 18px; width: 100%; text-align: left; transition: transform .15s var(--ease); }
.mini:active { transform: scale(.98); }
.mini .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--card-2); color: var(--accent-2); flex: none; }
.mini .ic svg { width: 22px; height: 22px; }
.mini b { display: block; font-weight: 650; }
.mini small { font-size: 13.5px; color: var(--muted); }
.chev { width: 18px; height: 18px; color: var(--dim); flex: none; }

/* ---------- Workout ---------- */
#wo:empty, #sum:empty { display: none; }
.full { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.full.in { animation: slideup .42s var(--ease) both; }
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
.wohead { position: sticky; top: 0; z-index: 3; background: rgba(10,13,18,0.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.wohead .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.wotitle { font-size: 28px; line-height: 1; }
.wostat { font-size: 13.5px; color: var(--muted); }
.finbtn { height: 40px; padding: 0 16px; border-radius: 13px; background: var(--card-2); font-weight: 750; font-size: 15px; transition: background .2s, color .2s, transform .15s; }
.finbtn.ready { background: var(--good); color: #062614; }
.finbtn:active { transform: scale(.95); }
.bar { height: 5px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s var(--spring); }
.wobody { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 140px) max(16px, env(safe-area-inset-left, 0px)); }

.xc { background: var(--card); border-radius: 22px; border: 1.5px solid transparent; transition: border-color .3s, opacity .3s; overflow: hidden; }
.xc.active { border-color: rgba(61,123,255,0.55); box-shadow: 0 0 0 4px rgba(61,123,255,0.08); }
.xc.complete { opacity: .82; }
.xc header { display: flex; align-items: center; gap: 12px; padding: 16px 14px 12px 16px; }
.xi { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 14px; font-weight: 800; background: var(--card-2); color: var(--muted); flex: none; transition: background .3s, color .3s; }
.xc.active .xi { background: var(--accent); color: #fff; }
.xc.complete .xi { background: var(--good); color: #062614; }
.xn { font-size: 23px; line-height: 1.02; overflow-wrap: anywhere; }
.xm { font-size: 13px; color: var(--muted); margin-top: 3px; }
.xcount { font-size: 13px; font-weight: 750; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; }
.dots svg { width: 20px; height: 20px; }
.xbody { padding: 0 14px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.coach { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--bg-2); }
.coach .tag { flex: none; margin-top: 1px; }
.coach p { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.coach p b { color: var(--ink); font-weight: 650; }
.xsum { padding: 0 16px 14px 58px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.sets { display: flex; flex-direction: column; gap: 8px; }
.sr { position: relative; display: grid; grid-template-columns: 22px minmax(0,1fr) 14px minmax(0,1fr) 56px; align-items: center; gap: 8px; }
.sr .si { font-size: 13px; font-weight: 800; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.sr .x { color: var(--dim); text-align: center; font-size: 14px; }
.chip { height: 54px; border-radius: 15px; background: var(--card-2); display: flex; align-items: baseline; justify-content: center; gap: 4px; transition: background .25s, transform .12s var(--ease); min-width: 0; }
.chip:active { transform: scale(.95); }
.chip b { font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.chip small { font-size: 12px; color: var(--muted); font-weight: 650; }
.chip.plan b { color: var(--muted); font-weight: 600; }
.chip.empty b { color: var(--accent-2); font-size: 15px; font-weight: 700; }
.tick { width: 56px; height: 54px; border-radius: 15px; display: grid; place-items: center; background: var(--card-2); transition: background .25s, transform .15s var(--ease); }
.tick svg { width: 26px; height: 26px; }
.tick .ck { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .32s var(--ease) .05s; }
.tick .ring { stroke: var(--dim); }
.sr.next .tick { background: rgba(61,123,255,0.18); }
.sr.next .tick .ring { stroke: var(--accent-2); }
.sr.done .tick { background: var(--good); animation: pop .42s var(--spring); }
.sr.done .tick .ring { stroke: transparent; }
.sr.done .tick .ck { stroke-dashoffset: 0; stroke: #062614; }
.sr.done .chip { background: var(--good-soft); }
.sr.done .chip.plan b { color: var(--ink); font-weight: 750; }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.sr.flash::after { content: ""; position: absolute; inset: -4px -6px; border-radius: 18px; background: radial-gradient(circle at 92% 50%, rgba(47,210,122,0.35), transparent 60%); animation: flash .7s ease-out forwards; pointer-events: none; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.xfoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pillbtn { height: 36px; padding: 0 14px; border-radius: 11px; background: var(--card-2); color: var(--muted); font-weight: 700; font-size: 14px; }
.plates { font-size: 12.5px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }

/* Rest pill */
.rest {
  position: fixed; z-index: 45; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border-radius: 26px;
  background: rgba(28,34,44,0.92); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 14px 34px rgba(0,0,0,0.5);
  animation: pillin .45s var(--spring) both; width: max-content; max-width: calc(100% - 24px);
}
@keyframes pillin { from { transform: translate(-50%, 140%); } to { transform: translate(-50%, 0); } }
.rest svg { width: 52px; height: 52px; transform: rotate(-90deg); flex: none; }
.rest .trk { stroke: rgba(255,255,255,0.1); }
.rest .arc { stroke: var(--accent); transition: stroke-dashoffset .3s linear, stroke .3s; }
.rest .rt { display: flex; flex-direction: column; min-width: 72px; }
.rest .rt b { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; font-stretch: 80%; }
.rest .rt small { font-size: 11px; font-weight: 750; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.rest button { height: 44px; padding: 0 14px; border-radius: 15px; background: rgba(255,255,255,0.08); font-weight: 750; font-size: 14px; }
.rest.over { background: rgba(20,60,38,0.95); animation: pillin .45s var(--spring) both, glow 1s ease-in-out infinite; }
.rest.over .arc { stroke: var(--good); }
.rest.over .rt b { color: var(--good); }
@keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(47,210,122,0.18), 0 14px 34px rgba(0,0,0,0.5); } }

/* ---------- Sheets ---------- */
#sheet:empty { display: none; }
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.55); animation: fade .25s ease both; }
.scrim.out { animation: fadeout .2s ease both; }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.panel {
  position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 88%;
  overflow-y: auto; background: var(--bg-2); border-radius: 28px 28px 0 0; border-top: 1px solid var(--line);
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px));
  animation: sheetin .4s var(--ease) both;
}
.panel.out { animation: sheetout .22s ease-in both; }
@keyframes sheetin { from { transform: translateY(100%); } }
@keyframes sheetout { to { transform: translateY(100%); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sb { display: flex; flex-direction: column; gap: 16px; }
.sh { font-size: 28px; line-height: 1; }
.sub { font-size: 14px; color: var(--muted); }

.adj { background: var(--card); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.adj .lab { display: flex; justify-content: space-between; font-size: 12px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.adjrow { display: grid; grid-template-columns: 64px minmax(0,1fr) 64px; gap: 10px; align-items: center; }
.adjrow button { height: 64px; border-radius: 18px; background: var(--card-2); font-size: 30px; font-weight: 600; transition: transform .1s; }
.adjrow button:active { transform: scale(.92); background: var(--line); }
.adjrow input { width: 100%; min-width: 0; height: 64px; border: 0; border-radius: 18px; background: var(--bg); text-align: center; font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; font-stretch: 85%; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { flex: 1; height: 36px; border-radius: 11px; background: var(--card-2); font-weight: 700; font-size: 14px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.btn { height: 56px; border-radius: 18px; background: var(--card); font-weight: 750; font-size: 16px; transition: transform .12s; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.good { background: var(--good); color: #062614; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); color: #fff; }
.btn.armed.good, .btn.good.armed { background: var(--good); color: #062614; }
.opts { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; overflow: hidden; }
.opt { display: flex; align-items: center; gap: 12px; padding: 15px 16px; text-align: left; border-top: 1px solid var(--line); width: 100%; min-width: 0; }
.opt:first-child { border-top: 0; }
.opt:active { background: var(--card-2); }
.opt .grow b { display: block; font-weight: 650; }
.opt .grow small { font-size: 13px; color: var(--muted); }
.opt.on { color: var(--accent-2); }
.search { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 14px; font-size: 16px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--card); border-radius: 15px; }
.seg button { flex: 1; height: 42px; border-radius: 11px; font-weight: 750; color: var(--muted); transition: background .2s, color .2s; }
.seg button.on { background: var(--accent); color: #fff; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: var(--card); border-radius: 16px; font-weight: 600; width: 100%; text-align: left; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--card-2); position: relative; transition: background .25s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .3s var(--spring); }
.sw.on { background: var(--good); }
.sw.on::after { transform: translateX(20px); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: 12px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* ---------- History & progress ---------- */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--card-2); animation: rise .4s var(--ease) both; animation-delay: calc(var(--d, 0) * 6ms); }
.heat i.on { background: var(--accent); box-shadow: 0 0 10px rgba(61,123,255,0.35); }
.heat i.today { outline: 1.5px solid var(--accent-2); outline-offset: 1px; }
.heat i.fut { background: transparent; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }

  ["front_squat","Front Squat","quads",["glutes"],"barbell","compound"],

  ["deadlift","Deadlift","hamstrings",["glutes","back"],"barbell","compound"],
  ["romanian_deadlift","Romanian Deadlift","hamstrings",["glutes","back"],"barbell","compound"],
  ["db_rdl","Dumbbell RDL","hamstrings",["glutes"],"dumbbell","compound"],
  ["lying_leg_curl","Lying Leg Curl","hamstrings",[],"machine","isolation"],
  ["seated_leg_curl","Seated Leg Curl","hamstrings",[],"machine","isolation"],
  ["sliding_leg_curl","Sliding Leg Curl","hamstrings",["glutes"],"bodyweight","isolation"],
  ["hip_thrust","Hip Thrust","glutes",["hamstrings"],"barbell","compound"],
  ["db_hip_thrust","Dumbbell Hip Thrust","glutes",["hamstrings"],"dumbbell","compound"],
  ["standing_calf_raise","Standing Calf Raise","calves",[],"machine","isolation"],
  ["seated_calf_raise","Seated Calf Raise","calves",[],"machine","isolation"],
  ["db_calf_raise","Dumbbell Calf Raise","calves",[],"dumbbell","isolation"],
  ["cable_crunch","Cable Crunch","abs",[],"cable","isolation"],
  ["hanging_leg_raise","Hanging Leg Raise","abs",[],"bodyweight","isolation"],
  ["crunch","Crunch","abs",[],"bodyweight","isolation"]

const LIB = LIB_ROWS.map(([id, name, primary, secondary, equipment, kind]) => ({ id, name, primary, secondary, equipment, kind }));
const LIB_BY_ID = Object.fromEntries(LIB.map(e => [e.id, e]));

// Strength + size, 3+ years: heavy main lift, volume after it. [sets, lo, hi, RIR, rest s]
const TARGET = { main: [4, 4, 6, 2, 180], secondary: [3, 6, 10, 2, 150], accessory: [3, 10, 15, 1, 90], isolation: [3, 12, 20, 1, 60] };

// [exercise, role]
const DAYS = {
  upper: ["Upper", [["bench_press","main"],["barbell_row","secondary"],["incline_db_press","accessory"],["lat_pulldown","accessory"],["lateral_raise","isolation"],["tricep_pushdown","isolation"],["barbell_curl","isolation"]]],
  lower: ["Lower", [["back_squat","main"],["romanian_deadlift","secondary"],["leg_press","accessory"],["lying_leg_curl","isolation"],["standing_calf_raise","isolation"],["cable_crunch","isolation"]]],
  push: ["Push", [["overhead_press","main"],["incline_bench","secondary"],["chest_press_machine","accessory"],["cable_lateral_raise","isolation"],["cable_fly","isolation"],["overhead_tricep_ext","isolation"]]],
  pull: ["Pull", [["deadlift","main"],["pull_up","secondary"],["seated_cable_row","accessory"],["face_pull","isolation"],["incline_db_curl","isolation"],["hammer_curl","isolation"]]],
  legs: ["Legs", [["hack_squat","main"],["hip_thrust","secondary"],["bulgarian_split_squat","accessory"],["leg_extension","isolation"],["seated_leg_curl","isolation"],["seated_calf_raise","isolation"],["hanging_leg_raise","isolation"]]],
  upperB: ["Upper B", [["overhead_press","main"],["pull_up","secondary"],["incline_bench","secondary"],["seated_cable_row","accessory"],["cable_fly","isolation"],["face_pull","isolation"],["incline_db_curl","isolation"],["overhead_tricep_ext","isolation"]]],
  lowerB: ["Lower B", [["deadlift","main"],["hack_squat","secondary"],["hip_thrust","accessory"],["leg_extension","isolation"],["seated_leg_curl","isolation"],["seated_calf_raise","isolation"],["hanging_leg_raise","isolation"]]],
  fbA: ["Full A", [["back_squat","main"],["bench_press","secondary"],["barbell_row","secondary"],["lying_leg_curl","isolation"],["lateral_raise","isolation"],["tricep_pushdown","isolation"]]],
  fbB: ["Full B", [["deadlift","main"],["overhead_press","secondary"],["lat_pulldown","secondary"],["incline_db_press","accessory"],["leg_extension","isolation"],["barbell_curl","isolation"]]],
  fbC: ["Full C", [["bench_press","main"],["leg_press","secondary"],["pull_up","secondary"],["hip_thrust","accessory"],["cable_lateral_raise","isolation"],["hammer_curl","isolation"]]],
  pushB: ["Push B", [["bench_press","main"],["db_shoulder_press","secondary"],["incline_db_press","accessory"],["dips","accessory"],["lateral_raise","isolation"],["skull_crusher","isolation"]]],
  pullB: ["Pull B", [["barbell_row","main"],["lat_pulldown","secondary"],["chest_supported_row","accessory"],["rear_delt_fly","isolation"],["barbell_curl","isolation"],["cable_curl","isolation"]]],
  legsB: ["Legs B", [["back_squat","main"],["romanian_deadlift","secondary"],["leg_press","accessory"],["lying_leg_curl","isolation"],["standing_calf_raise","isolation"],["cable_crunch","isolation"]]]
};
function splitDays(n) {
  if (n <= 3) return [DAYS.fbA, DAYS.fbB, DAYS.fbC];
  if (n === 4) return [DAYS.upper, DAYS.lower, DAYS.upperB, DAYS.lowerB];
  if (n === 5) return [DAYS.upper, DAYS.lower, DAYS.push, DAYS.pull, DAYS.legs];
  return [DAYS.pushB, DAYS.pullB, DAYS.legsB, DAYS.push, DAYS.pull, DAYS.legs];
}
function splitName(n) {
  if (n <= 3) return "3-day Full Body";
  if (n === 4) return "4-day Upper / Lower";
  if (n === 5) return "5-day Upper · Lower · Push · Pull · Legs";
  return "6-day Push · Pull · Legs";
}
function uid() {
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function planItem(exerciseID, role) {
  const [sets, lo, hi, rir, rest] = TARGET[role];
  return { id: uid(), exerciseID, sets, repLow: lo, repHigh: hi, targetRIR: rir, restSeconds: rest };
}
function generatePlan(days) {
  return {
    id: uid(), name: splitName(days), createdAt: new Date().toISOString(),
    days: splitDays(days).map(([name, slots]) => ({ id: uid(), name, exercises: slots.filter(([id]) => LIB_BY_ID[id]).map(([id, role]) => planItem(id, role)) }))
  };
}
function defaultItem(ex) { return planItem(ex.id, ex.kind === "compound" ? "secondary" : "isolation"); }

// ----- units -----
const KG_PER_LB = 0.45359237;
const fromKg = (kg, u) => u === "kg" ? kg : kg / KG_PER_LB;
const toKg = (v, u) => u === "kg" ? v : v * KG_PER_LB;
const fmt = n => String(Math.round(n * 100) / 100);
function parseNum(str) {
  const t = String(str).replace(",", ".").trim();
  if (t === "") return null;
  const n = Number(t);
  return Number.isFinite(n) && n >= 0 ? n : undefined;
}

// ----- progression (double progression) -----
function increment(ex, u) {
  const kg = u === "kg";
  if (ex.equipment === "dumbbell") return kg ? 2 : 5;
  if (ex.equipment === "bodyweight") return kg ? 2.5 : 5;
  return LOWER.has(ex.primary) ? (kg ? 5 : 10) : (kg ? 2.5 : 5);
}
function roundStep(ex, u) { return ex.equipment === "barbell" ? (u === "kg" ? 2.5 : 5) : (u === "kg" ? 0.5 : 1); }
function adjStep(ex, u) { if (ex.equipment === "dumbbell") return u === "kg" ? 2 : 5; return u === "kg" ? 2.5 : 5; }
function e1rm(w, reps) { return reps <= 1 ? w : w * (1 + reps / 30); }

function topSet(entry) {
  const w = workingSets(entry);
  if (!w.length) return null;
  const top = Math.max(...w.map(s => s.weightKg || 0));
  return { weight: top, reps: w.filter(s => Math.abs((s.weightKg || 0) - top) < 0.01).map(s => s.reps) };
}
function bestE1RM(entry) { const w = workingSets(entry); return w.length ? Math.max(...w.map(s => e1rm(s.weightKg || 0, s.reps))) : 0; }
function shortDate(iso) { return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }

// Returns { kind: new|up|beat|down|hold, weightKg, targetReps[], tag, line, last }
function suggest(ex, plannedSets, lo, hi, history, u) {
  const sets = Math.max(1, plannedSets);
  const valid = history.filter(h => topSet(h.entry));
  if (!valid.length) {
    return { kind: "new", weightKg: null, targetReps: Array(sets).fill(lo), tag: "New",
      line: `Find a weight you can lift for <b>${lo}–${hi}</b> reps with 1–2 left in the tank.`, last: "" };
  }
  const top = topSet(valid[0].entry);
  const shown = fromKg(top.weight, u);
  const wt = top.weight > 0 ? `${fmt(shown)} ${u}` : "bodyweight";
  const last = `Last ${shortDate(valid[0].date)}: ${top.weight > 0 ? fmt(shown) + " " + u : "BW"} × ${top.reps.join(", ")}`;
  const first = top.reps.slice(0, sets);
  if (first.length >= sets && first.every(r => r >= hi)) {
    const step = roundStep(ex, u);
    const next = Math.round((shown + increment(ex, u)) / step) * step;
    return { kind: "up", weightKg: toKg(next, u), targetReps: Array(sets).fill(lo), tag: `↑ ${fmt(next)} ${u}`,
      line: `You hit <b>${hi}</b> on every set. Go up to <b>${fmt(next)} ${u}</b> and build back to ${hi}.`, last };
  }
  const belowLo = first.some(r => r < lo);
  if (belowLo && top.weight > 0 && valid.length > 1) {
    const prev = topSet(valid[1].entry);
    if (prev && Math.abs(prev.weight - top.weight) < 0.01 && prev.reps.slice(0, sets).some(r => r < lo)) {
      const step = roundStep(ex, u);
      const reduced = Math.max(step, Math.round(shown * 0.9 / step) * step);
      return { kind: "down", weightKg: toKg(reduced, u), targetReps: Array(sets).fill(hi), tag: `↓ ${fmt(reduced)} ${u}`,
        line: `Stuck under ${lo} reps twice. Drop to <b>${fmt(reduced)} ${u}</b> and build back up.`, last };
    }
  }
  const targets = [];
  for (let i = 0; i < sets; i++) targets.push(Math.min(hi, Math.max(lo, (top.reps[i] != null ? top.reps[i] : lo) + 1)));
  return { kind: "beat", weightKg: top.weight > 0 ? top.weight : null, targetReps: targets, tag: "Beat reps",
    line: `Same ${wt}. Aim for <b>${targets.join(" · ")}</b>.`, last };

function plateMath(total, u) {
  const bar = u === "kg" ? 20 : 45;
  const plates = u === "kg" ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];
  if (!(total > bar)) return null;
  let side = (total - bar) / 2;
  const out = [];
  for (const p of plates) while (side >= p - 1e-6) { out.push(p); side -= p; }
  return { bar, plates: out, rest: side > 0.01 ? side : 0 };
}

// ----- dates -----
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function startOfWeek(d) { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dayKey(d) { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }

if (typeof module !== "undefined") module.exports = { LIB, LIB_BY_ID, generatePlan, suggest, plateMath, topSet, bestE1RM, splitDays, parseNum };
</script>

<script id="app">
"use strict";
// ======================= State =======================
const KEY = "ironlog-v2";
function freshData() {
  return { v: 2, settings: { name: "Necke", unit: "kg", days: 5 }, plan: generatePlan(5), sessions: [], custom: [], active: null };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return freshData();
    const d = JSON.parse(raw);
    const f = freshData();
    return {
      v: 2,
      settings: Object.assign(f.settings, d.settings || {}),
      plan: d.plan && Array.isArray(d.plan.days) && d.plan.days.length ? d.plan : f.plan,
      sessions: Array.isArray(d.sessions) ? d.sessions.filter(s => s && s.start && Array.isArray(s.entries)).sort((a, b) => new Date(a.start) - new Date(b.start)) : [],
      custom: Array.isArray(d.custom) ? d.custom : [],
      active: d.active && Array.isArray(d.active.entries) ? d.active : null
    };
  } catch (e) { return freshData(); }
}
let D = load();
let saveT = null;

function saveNow() { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast("Could not save. Storage is full."); } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); else { keepAwake(!!D.active && UI.wo); tick(); } });

const UI = { tab: "train", lift: null, wo: false, sheet: null, expanded: new Set(), enter: true, rest: null };
const $ = id => document.getElementById(id);

// ======================= Queries =======================
function history(exId) {
  const out = [];
  for (let i = D.sessions.length - 1; i >= 0; i--) for (const e of D.sessions[i].entries) if (e.exerciseID === exId) out.push({ date: D.sessions[i].start, entry: e });

}

  $("sheet").innerHTML = `<div class="scrim" data-a="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div class="sb" id="sb">${sheetBody()}</div></div>`;
}
function refreshSheet() { const b = $("sb"); if (b) b.innerHTML = sheetBody(); }
function closeSheet() {
  const p = document.querySelector("#sheet .panel"), sc = document.querySelector("#sheet .scrim");
  UI.sheet = null;

}
function openAdjust(e, s, thenDone) {

      <div class="two"><button class="btn" data-a="adj-save">Save</button><button class="btn good" data-a="adj-done">${IC.check.replace("<svg", '<svg width="20" height="20"')} Save &amp; done</button></div>`;

}

// ======================= History =======================
function renderHistory() {
  const weeks = 18;
  const start = addDays(startOfWeek(new Date()), -7 * (weeks - 1));
  const trained = new Set(D.sessions.map(s => dayKey(s.start)));
  const tk = dayKey(new Date()), now = startOfDay(new Date());
  let cells = "";
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), k = dayKey(d);
    cells += `<i class="${trained.has(k) ? "on" : ""} ${k === tk ? "today" : ""} ${d > now ? "fut" : ""}" style="--d:${i}" title="${k}"></i>`;
  }
  const monthCount = D.sessions.filter(s => { const d = new Date(s.start), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); }).length;
  let html = `<div class="topbar"><div class="grow"><div class="hello">${D.sessions.length} workouts logged</div><div class="title cond">History</div></div></div>
    <div class="card"><div class="row between"><span class="eyebrow">Last ${weeks} weeks</span><span class="eyebrow dim">Mon → Sun</span></div><div class="heat">${cells}</div></div>
    <div class="stats"><div class="stat"><b class="num">${streak()}</b><small>week streak</small></div><div class="stat"><b class="num">${weekSessions(startOfWeek(new Date())).length}</b><small>this week</small></div><div class="stat"><b class="num">${monthCount}</b><small>this month</small></div></div>`;
  if (!D.sessions.length) return html + `<div class="card empty">${IC.hist}<b>No workouts yet</b><span class="muted">Finish your first session and it shows up here.</span></div>`;
  let month = "";
  const items = [];
  for (const s of D.sessions.slice().reverse()) {
    const m = new Date(s.start).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    if (m !== month) { items.push(`<div class="mhead">${h(m)}</div>`); month = m; }
    items.push(`<button class="mini" data-a="session" data-id="${h(s.id)}"><span class="ic num" style="font-weight:800;font-size:17px;color:var(--ink)">${new Date(s.start).getDate()}</span>
      <span class="grow"><b>${h(s.dayName)}</b><small class="num">${h(new Date(s.start).toLocaleDateString("en-GB", { weekday: "long" }))} · ${doneCount(s)} sets</small></span>${IC.chev}</button>`);
  }
  return html + `<div class="list">${items.join("")}</div>`;
}

// ======================= Progress =======================
function spark(pts) {
  const p = pts.slice(-10); if (p.length < 2) return `<svg class="spark" viewBox="0 0 84 34"></svg>`;
  const ys = p.map(x => x.e1rm || Math.max(...x.reps)), mn = Math.min(...ys), mx = Math.max(...ys), r = mx - mn || 1;
  const c = p.map((_, i) => [i / (p.length - 1) * 80 + 2, 30 - (ys[i] - mn) / r * 26]);
  return `<svg class="spark" viewBox="0 0 84 34"><path d="M${c.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L")}"/><circle cx="${c[c.length - 1][0].toFixed(1)}" cy="${c[c.length - 1][1].toFixed(1)}" r="3"/></svg>`;
}
function renderProgress() {
  const ids = loggedIds(), u = U();
  let html = `<div class="topbar"><div class="grow"><div class="hello">Estimated 1-rep max per lift</div><div class="title cond">Progress</div></div></div>`;
  if (!ids.length) return html + `<div class="card empty">${IC.prog}<b>Nothing to chart yet</b><span class="muted">Log a workout. Every lift gets its own strength curve.</span></div>`;
  return html + `<div class="list">${ids.map(id => {
    const pts = points(id), best = Math.max(...pts.map(p => p.e1rm)), gain = best - pts[0].e1rm, bw = best === 0;
    return `<button class="lift" data-a="lift" data-id="${h(id)}"><span style="min-width:0"><span class="nm" style="display:block">${h(exercise(id).name)}</span><small>${pts.length} session${pts.length > 1 ? "s" : ""}</small></span>
      ${spark(pts)}<span class="val">${bw ? `<b>${Math.max(...pts.map(p => Math.max(...p.reps)))}</b><em style="color:var(--muted)">reps</em>` : `<b>${fmt(Math.round(fromKg(best, u)))}</b>${gain > 0.4 ? `<em>+${fmt(Math.round(fromKg(gain, u) * 10) / 10)}</em>` : `<em style="color:var(--muted)">${u}</em>`}`}</span></button>`; }).join("")}</div>`;
}
function chart(pts, val) {
  const W = 340, H = 190, L = 34, R = 12, T = 14, B = 26;
  const ys = pts.map(val);
  let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mx - mn < 1) { mn -= 2; mx += 2; }
  const pad = (mx - mn) * .18; mn -= pad; mx += pad;
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i / (pts.length - 1) * (W - L - R);
  const y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const c = pts.map((p, i) => [x(i), y(val(p))]);
  let len = 0; for (let i = 1; i < c.length; i++) len += Math.hypot(c[i][0] - c[i - 1][0], c[i][1] - c[i - 1][1]);
  const line = "M" + c.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L");
  const area = `${line} L${c[c.length - 1][0].toFixed(1)} ${H - B} L${c[0][0].toFixed(1)} ${H - B} Z`;
  let runMax = -Infinity;
  const isPR = ys.map(v => { const pr = v > runMax + 0.01 && runMax !== -Infinity; runMax = Math.max(runMax, v); return pr; });
  const ticks = [mn + (mx - mn) * .2, (mn + mx) / 2, mx - (mx - mn) * .2];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><defs><linearGradient id="fillgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D7BFF" stop-opacity=".35"/><stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line class="g" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`).join("")}
    ${c.length > 1 ? `<path class="ar" d="${area}"/><path class="ln draw" d="${line}" style="--len:${Math.ceil(len) + 2}"/>` : ""}
    ${c.map((q, i) => `<circle class="pt ${isPR[i] ? "pr" : ""}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i === c.length - 1 ? 5.5 : 4}" style="opacity:0;animation:fadein .3s ease ${(0.2 + i / Math.max(1, c.length - 1) * 1).toFixed(2)}s forwards"/>`).join("")}
    <text x="${L}" y="${H - 6}">${h(shortDate(pts[0].date))}</text>${pts.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${h(shortDate(pts[pts.length - 1].date))}</text>` : ""}
  </svg></div>`;
}
function renderLift() {
  const id = UI.lift, u = U(), pts = points(id);
  if (!pts.length) { UI.lift = null; return renderProgress(); }
  const bw = pts.every(p => p.top === 0);
  const val = bw ? (p => Math.max(...p.reps)) : (p => fromKg(p.e1rm, u));
  const cur = val(pts[pts.length - 1]), first = val(pts[0]), best = Math.max(...pts.map(val));
  const heavy = pts.reduce((a, p) => p.top > a.top ? p : a, pts[0]);
  return `<div class="topbar"><button class="iconbtn" data-a="lift-back" aria-label="Back">${IC.back}</button><div class="grow"><div class="hello">${bw ? "Best set" : "Estimated 1-rep max"}</div></div></div>
    <div><div class="title cond" style="font-size:30px">${h(exercise(id).name)}</div>
      <div class="row" style="align-items:baseline;gap:8px;margin-top:8px"><span class="big cond" data-count="${Math.round(cur)}">0</span><span class="muted" style="font-weight:700">${bw ? "reps" : u}</span>
      ${cur - first > 0.4 ? `<span class="tag new" style="margin-left:6px">+${fmt(Math.round(cur - first))} since start</span>` : ""}</div></div>
    <div class="card">${chart(pts, val)}<span class="sub" style="font-size:12.5px">Gold dots = new personal best.</span></div>
    <div class="recs"><div class="rec"><small>Best ${bw ? "reps" : "e1RM"}</small><b>${fmt(Math.round(best))}</b></div>
      <div class="rec"><small>Heaviest</small><b>${heavy.top > 0 ? wText(heavy.top) : "BW"}</b></div><div class="rec"><small>Sessions</small><b>${pts.length}</b></div></div>
    <div class="box">${pts.slice().reverse().map(p => `<div class="hrow"><span class="muted">${h(new Date(p.date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" }))}</span><span>${p.top > 0 ? wText(p.top) + " " + u : "BW"} × ${p.reps.join(" · ")}</span></div>`).join("")}</div>`;
}
function countUps(root) {
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec || 0), t0 = performance.now(), dur = 900;
    if (reduce) { el.textContent = to.toFixed(dec); return; }
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = (to * e).toFixed(dec); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// ======================= Summary =======================
function showSummary(s, prs) {
  const u = U();
  const mins = Math.max(1, Math.round((new Date(s.end) - new Date(s.start)) / 60000));
  const vol = s.entries.reduce((a, e) => a + e.sets.reduce((b, x) => b + (x.weightKg || 0) * x.reps, 0), 0);
  const tons = fromKg(vol, u) / 1000;
  $("sum").innerHTML = `<div class="full in"><div class="sum">
    <div class="done-ic">${IC.check}</div>
    <div><div class="eyebrow blue">Workout complete</div><h1 class="cond">${h(s.dayName)}<br>done.</h1></div>
    <div class="sumstats"><div class="stat"><b class="num" data-count="${mins}">0</b><small>${mins === 1 ? "minute" : "minutes"}</small></div>
      <div class="stat"><b class="num" data-count="${doneCount(s)}">0</b><small>${doneCount(s) === 1 ? "set" : "sets"}</small></div>
      <div class="stat"><b class="num" data-count="${tons.toFixed(1)}" data-dec="1">0</b><small>${u === "kg" ? "tonnes" : "k lb"} moved</small></div></div>
    ${prs.length ? `<div class="list">${prs.map((p, i) => `<div class="pr" style="--i:${i}"><span class="medal">PR</span><span class="grow"><b>${h(p.name)}</b><small>${p.w > 0 ? wText(p.w) + " " + u : "BW"} × ${p.r} · e1RM +${fmt(Math.round(fromKg(p.gain, u) * 10) / 10)} ${u}</small></span></div>`).join("")}</div>`
      : `<p class="muted">Every rep logged. Next session the app tells you where to push.</p>`}
    <button class="go cond" data-a="sum-close">Done</button></div></div>`;
  countUps($("sum"));
  confetti(prs.length ? 160 : 70);
}
function confetti(n) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ["#3D7BFF", "#86ACFF", "#FFC53D", "#2FD27A", "#FFFFFF"];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .32, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4,
    w: 5 + Math.random() * 6, hgt: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  (function frame(now) {
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .32; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - t / 2600); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.hgt / 2, p.w, p.hgt); ctx.restore(); }
    if (t < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.width = 0; cv.height = 0; }
  })(t0);
}

// ======================= Events =======================
function armed(el) {
  if (!el.dataset.arm) return true;
  if (el.classList.contains("armed")) return true;
  el.dataset.label = el.innerHTML; el.classList.add("armed"); el.innerHTML = `<span class="grow"><b>${h(el.dataset.arm)}</b></span>`;
  if (!el.classList.contains("opt")) el.textContent = el.dataset.arm;
  setTimeout(() => { if (el.isConnected && el.classList.contains("armed")) { el.classList.remove("armed"); el.innerHTML = el.dataset.label; } }, 3000);
  return false;
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, ds = el.dataset;
  unlockAudio();
  if (a === "card-toggle" && ev.target.closest('[data-a="card-menu"]')) return;
  if (!armed(el)) return;
  switch (a) {
    case "tab": go(ds.v); break;
    case "settings": openSheet({ type: "settings" }); break;
    case "close": closeSheet(); break;
    case "start": { const d = D.plan.days.find(x => x.id === ds.id); if (d) { if (UI.sheet) closeSheet(); startDay(d); } break; }
    case "resume": openWo(true); break;
    case "days": openSheet({ type: "days" }); break;
    case "session": openSheet({ type: "session", id: ds.id }); break;
    case "session-del": D.sessions = D.sessions.filter(s => s.id !== UI.sheet.id); save(); closeSheet(); render(); toast("Workout deleted"); break;

    case "wo-min": closeWo(); break;
    case "finish": openSheet({ type: "finish" }); break;
    case "finish-yes": closeSheet(); finishWorkout(); break;
    case "discard": D.active = null; save(); closeWo(); toast("Workout discarded"); break;
    case "card-toggle": { const e = findE(ds.e); if (!e || !e.sets.every(s => s.done)) break; UI.expanded.has(e.id) ? UI.expanded.delete(e.id) : UI.expanded.add(e.id); refreshCard(e); break; }
    case "card-menu": openSheet({ type: "menu", e: ds.e }); break;
    case "tick": { const e = findE(ds.e); const s = e && e.sets.find(x => x.id === ds.s); if (s) tickSet(e, s); break; }
    case "adjust": { const e = findE(ds.e); const s = e && e.sets.find(x => x.id === ds.s); if (s) openAdjust(e, s, false); break; }
    case "adj": {
      const S = UI.sheet; const d = Number(ds.d);
      if (ds.f === "w") S.w = Math.max(0, Math.round(((S.w || 0) + d) * 100) / 100);
      else S.r = Math.max(0, (S.r || 0) + d);
      const wi = $("adjW"), ri = $("adjR");
      if (wi) wi.value = S.w != null ? fmt(S.w) : ""; if (ri) ri.value = S.r != null ? S.r : "";
      updatePlates(); break;
    }
    case "adj-save": case "adj-done": {
      const S = UI.sheet, e = findE(S.e), s = e && e.sets.find(x => x.id === S.s); if (!s) { closeSheet(); break; }
      const old = s.weightKg;
      s.weightKg = S.w == null ? null : Math.round(toKg(S.w, U()) * 1000) / 1000;
      s.reps = S.r == null ? null : S.r;
      if (s.weightKg !== old) for (const o of e.sets) if (!o.done && e.sets.indexOf(o) > e.sets.indexOf(s) && (o.weightKg === old || o.weightKg == null)) o.weightKg = s.weightKg;
      closeSheet();
      if (a === "adj-done" || S.thenDone) { s.done = false; tickSet(e, s); } else { save(); refreshCard(e); }
      break;
    }
    case "set-add": {
      const e = findE(ds.e); if (!e) break;
      const last = e.sets[e.sets.length - 1];
      e.sets.push({ id: uid(), weightKg: last ? last.weightKg : null, reps: null, target: last ? last.target : e.repLow, done: false });
      UI.expanded.add(e.id); save(); refreshCard(e); if (ds.close) closeSheet(); break;
    }
    case "set-del": { const e = findE(ds.e); if (!e || e.sets.length < 2) break; e.sets.pop(); save(); refreshCard(e); break; }
    case "ex-remove": { D.active.entries = D.active.entries.filter(e => e.id !== UI.sheet.e); save(); closeSheet(); renderWo(); break; }
    case "swap-open": openSheet({ type: "swap", e: UI.sheet.e, keep: true, q: "" }); break;
    case "swap-keep": UI.sheet.keep = !UI.sheet.keep; refreshSheet(); break;
    case "add-ex": openSheet({ type: "add", q: "" }); break;
    case "swap-pick": {
      const ex = exercise(ds.id), S = UI.sheet;
      if (S.type === "add") {
        const t = defaultItem(ex);
        D.active.entries.push(makeEntry(ex.id, null, t.sets, t.repLow, t.repHigh, t.restSeconds));
        save(); closeSheet(); renderWo();
        setTimeout(() => { const w = $("woScroll"); if (w) w.scrollTo({ top: w.scrollHeight, behavior: "smooth" }); }, 50);
      } else {
        const e = findE(S.e); if (!e) break;
        const fresh = makeEntry(ex.id, e.planExerciseID, e.sets.length, e.repLow, e.repHigh, e.restSeconds);
        Object.assign(e, { exerciseID: ex.id, kind: fresh.kind, tag: fresh.tag, line: fresh.line, last: fresh.last,
          sets: e.sets.map((s, i) => s.done ? s : Object.assign(s, { weightKg: fresh.sets[i] ? fresh.sets[i].weightKg : null, target: fresh.sets[i] ? fresh.sets[i].target : e.repLow })) });
        if (S.keep && e.planExerciseID) for (const d of D.plan.days) for (const it of d.exercises) if (it.id === e.planExerciseID) it.exerciseID = ex.id;
        save(); closeSheet(); refreshCard(e); toast(S.keep ? "Swapped, plan updated" : "Swapped for today");
      }
      break;
    }
    case "rest-add": if (UI.rest) { UI.rest.end += 30000; UI.rest.total += 30; UI.rest.fired = false; renderRest(); } break;
    case "rest-skip": UI.rest = null; renderRest(); break;

    case "lift": UI.lift = ds.id; UI.enter = true; render(); window.scrollTo(0, 0); break;
    case "lift-back": UI.lift = null; UI.enter = true; render(); break;

    case "unit": D.settings.unit = ds.v; save(); refreshSheet(); render(); break;
    case "split": UI.sheet.days = Number(ds.v); refreshSheet(); break;
    case "rebuild": D.settings.days = UI.sheet.days; D.plan = generatePlan(D.settings.days); save(); closeSheet(); UI.enter = true; render(); toast("New plan ready"); break;
    case "export": doExport(); break;
    case "import": $("importFile").click(); break;
    case "reset": { localStorage.removeItem(KEY); D = freshData(); saveNow(); closeSheet(); UI.enter = true; UI.tab = "train"; render(); toast("All data erased"); break; }
    case "sum-close": $("sum").innerHTML = ""; UI.tab = "train"; UI.enter = true; render(); window.scrollTo(0, 0); break;
  }
});
function updatePlates() {
  const S = UI.sheet; if (!S || S.type !== "adjust") return;
  const e = findE(S.e); const pl = $("adjPl"); if (!e || !pl) return;
  const pm = exercise(e.exerciseID).equipment === "barbell" && S.w ? plateMath(S.w, U()) : null;
  pl.textContent = pm ? "Per side " + pm.plates.map(fmt).join(" + ") : "";
}
document.addEventListener("input", ev => {
  const el = ev.target; const k = el.dataset && el.dataset.in; if (!k) return;
  const S = UI.sheet;
  if (k === "adjW" && S) { const n = parseNum(el.value); if (n !== undefined) { S.w = n; updatePlates(); } }
  else if (k === "adjR" && S) { const n = parseNum(el.value); if (n !== undefined) S.r = n == null ? null : Math.floor(n); }
  else if (k === "swapq" && S) { S.q = el.value; const box = $("swapList"); if (box) {
      const cur = S.type === "swap" ? exercise(findE(S.e).exerciseID) : null; const q = S.q.trim().toLowerCase();
      let list = LIB.concat(D.custom).filter(x => !cur || x.id !== cur.id);
      if (q) list = list.filter(x => x.name.toLowerCase().includes(q) || x.primary.includes(q) || x.equipment.includes(q)); else if (cur) list = list.filter(x => x.primary === cur.primary);
      box.innerHTML = swapList(list); } }
  else if (k === "name") { D.settings.name = el.value.trim(); save(); }
});
document.addEventListener("change", ev => { if (ev.target.dataset && ev.target.dataset.in === "name") render(); });

$("importFile").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.sessions) || !d.plan) throw new Error("bad");
      localStorage.setItem(KEY, JSON.stringify(d)); D = load(); saveNow(); closeSheet(); UI.enter = true; render(); toast(`Imported ${D.sessions.length} workouts`);
    } catch (e) { toast("That file is not an Iron Log backup"); }
  };
  r.readAsText(f);
});
async function doExport() {
  const name = `iron-log-${dayKey(new Date())}.json`;
  const blob = new Blob([JSON.stringify(D)], { type: "application/json" });
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Iron Log backup" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), link = document.createElement("a");
  link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ======================= Boot =======================
render();
if (D.active) openWo(false);
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
